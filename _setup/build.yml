name: build

# main に push したら、ビルドが通るか確かめる。
# v で始まるタグ（例：v1.0.0）を push したら、.NET 込みの 1 ファイル版 exe を作って Releases に載せる。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build MidiPlayerWpf.sln -c Release

      - name: Publish (single file, self-contained)
        run: >
          dotnet publish MidiPlayerWpf/MidiPlayerWpf.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Zip
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          Compress-Archive -Path publish/MidiPlayerWpf.exe, README.md, LICENSE -DestinationPath "MidiPlayerWpf-$name-win-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: MidiPlayerWpf-win-x64
          path: MidiPlayerWpf-*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MidiPlayerWpf-*.zip
          generate_release_notes: true
